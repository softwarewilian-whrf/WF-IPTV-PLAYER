<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF IPTV PLAYER</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="tv"></i>
                </div>
                <h1>WF IPTV PLAYER</h1>
                <p>Aceda aos seus canais, filmes e séries</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="server-url">SERVIDOR / URL</label>
                    <input type="text" id="server-url" value="https://nivok.xyz" placeholder="https://exemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="username">UTILIZADOR</label>
                    <input type="text" id="username" placeholder="O seu utilizador" required>
                </div>

                <div class="input-group">
                    <label for="password">PALAVRA-PASSE</label>
                    <input type="password" id="password" placeholder="A sua palavra-passe" required>
                </div>

                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
        </div>
    </div>

    <!-- ECRÃ DO DASHBOARD (MENU PRINCIPAL) -->
    <div id="dashboard-screen" class="screen">
        <header class="app-header">
            <h2>WF IPTV PLAYER</h2>
            <span id="clock">00:00:00</span>
        </header>

        <main class="dashboard-grid">
            <div class="dash-card" onclick="openCatalog('live')">
                <i data-lucide="tv"></i>
                <h3>Canais ao Vivo</h3>
            </div>
            <div class="dash-card" onclick="openCatalog('movies')">
                <i data-lucide="film"></i>
                <h3>Filmes</h3>
            </div>
            <div class="dash-card" onclick="openCatalog('series')">
                <i data-lucide="clapperboard"></i>
                <h3>Séries</h3>
            </div>
        </main>
    </div>

    <!-- ECRÃ DE CATÁLOGO (CANAIS, FILMES E SÉRIES) -->
    <div id="catalog-screen" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="switchScreen('dashboard-screen')">
                <i data-lucide="arrow-left"></i> Voltar
            </button>
            <h2 id="catalog-title">CATÁLOGO</h2>
            <input type="text" id="catalog-search-input" placeholder="Pesquisar...">
        </header>

        <div class="catalog-layout">
            <aside class="sidebar">
                <h3>Categorias</h3>
                <ul id="category-list" class="category-list"></ul>
            </aside>

            <main class="content-area">
                <div id="catalog-grid" class="catalog-grid"></div>
            </main>
        </div>
    </div>

    <!-- ECRÃ DO PLAYER DE VÍDEO -->
    <div id="player-screen" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="switchScreen('catalog-screen')">
                <i data-lucide="arrow-left"></i> Voltar
            </button>
            <h2 id="playing-title">A reproduzir...</h2>
        </header>

        <div class="player-layout">
            <div class="video-container">
                <video id="video-player" controls autoplay playsinline></video>
            </div>
            <aside class="player-sidebar">
                <h3>Lista / Episódios</h3>
                <ul id="sidebar-list" class="sidebar-list"></ul>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
