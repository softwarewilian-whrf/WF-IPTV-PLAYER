<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF IPTV PLAYER</title>
    <!-- CSS da Aplicação -->
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca HLS.js para reprodução de streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-section" class="screen active">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="tv"></i>
                </div>
                <h1>WF IPTV PLAYER</h1>
                <p>Aceda aos seus canais, filmes e séries</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="server-url">SERVIDOR / URL</label>
                    <input type="text" id="server-url" value="https://nivok.xyz" placeholder="https://exemplo.com:8080" required>
                </div>

                <div class="input-group">
                    <label for="username">UTILIZADOR</label>
                    <input type="text" id="username" placeholder="O seu utilizador" required>
                </div>

                <div class="input-group">
                    <label for="password">PALAVRA-PASSE</label>
                    <input type="password" id="password" placeholder="A sua palavra-passe" required>
                </div>

                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
        </div>
    </div>

    <!-- ECRÃ PRINCIPAL / APLICAÇÃO -->
    <div id="app-section" class="screen" style="display: none;">
        <header class="app-header">
            <div class="header-left">
                <h2>WF IPTV PLAYER</h2>
            </div>
            <div class="header-right">
                <span id="clock">00:00:00</span>
            </div>
        </header>

        <main class="app-content">
            <!-- Seleção de Categorias -->
            <div class="controls-bar">
                <label for="category-select">Categoria:</label>
                <select id="category-select">
                    <option value="">Selecione uma categoria...</option>
                </select>
            </div>

            <div class="main-layout">
                <!-- Lista de Streams / Canais -->
                <div class="sidebar">
                    <h3>Canais</h3>
                    <ul id="stream-list" class="stream-list"></ul>
                </div>

                <!-- Reprodutor de Vídeo -->
                <div class="player-container">
                    <video id="video-player" controls autoplay playsinline></video>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript da Aplicação -->
    <script src="script.js"></script>
</body>
</html>
