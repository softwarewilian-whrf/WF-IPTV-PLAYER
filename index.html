<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IPTV - Portal de Canais</title>

    <style>
        :root {
            --bg-color: #0f1015;
            --sidebar-color: #161821;
            --card-bg: #1a1c26;
            --card-hover: #262936;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .logo-area {
            padding: 24px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-tabs {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 15px;
        }

        .nav-tabs::-webkit-scrollbar {
            width: 5px;
        }
        .nav-tabs::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .nav-tabs li {
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .nav-tabs li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
        }

        .nav-tabs li.active {
            background-color: var(--accent-color);
            color: var(--text-color);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 32px;
            background-color: var(--bg-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .player-container {
            width: 100%;
            background-color: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .playing-info {
            width: 100%;
            max-width: 900px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(25, 25, 35, 0.9);
        }

        .playing-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .close-player {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .content-area {
            padding: 32px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 24px;
            align-content: start;
        }

        .channel-card {
            background-color: transparent;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
            text-decoration: none;
            color: inherit;
            gap: 8px;
            cursor: pointer;
        }

        .channel-card:hover {
            transform: scale(1.05);
        }

        .channel-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: var(--card-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .channel-poster img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
            padding: 0 2px;
        }

        .channel-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-category {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .no-logo {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

        let hlsInstance = null;

        function renderChannels(categoryFilter) {
            const container = document.getElementById('channelContainer');
            const titleElement = document.getElementById('categoryTitle');
            
            container.innerHTML = '';

            let filteredChannels = channels;
            if (categoryFilter !== 'todos') {
                filteredChannels = channels.filter(c => c.category === categoryFilter);
                titleElement.textContent = categoryFilter;
            } else {
                titleElement.textContent = "Todos os Canais";
            }

            filteredChannels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => playChannel(channel.url, channel.name);

                card.innerHTML = `
                    <div class="channel-poster">
                        <img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/150?text=TV';">
                    </div>
                    <div class="channel-info">
                        <span class="channel-name" title="${channel.name}">${channel.name}</span>
                        <span class="channel-category">${channel.category}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playChannel(url, name) {
            const video = document.getElementById('videoPlayer');
            const playerContainer = document.getElementById('playerContainer');
            const playingTitle = document.getElementById('playingTitle');

            playerContainer.style.display = 'flex';
            playingTitle.textContent = `Assistindo: ${name}`;
            document.querySelector('.main-container').scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            const playerContainer = document.getElementById('playerContainer');

            video.pause();
            video.src = "";
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            playerContainer.style.display = 'none';
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.nav-tabs li').forEach(li => li.classList.remove('active'));
            element.classList.add('active');
            renderChannels(category);
        }

        window.onload = function() {
            renderChannels('todos');
        };
    </script>
