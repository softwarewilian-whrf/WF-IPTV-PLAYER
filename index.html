<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF TV </title>
    <!-- Tailwind CSS para o visual -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hls.js para reprodução de streams .m3u8 no navegador -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-cyan-400 tracking-wider">WF TV Online</h1>
            <input type="text" id="searchInput" placeholder="Pesquisar canal..." 
                class="w-full md:w-80 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- Player de Vídeo (Coluna da Esquerda - Fixado no topo ao rolar) -->
        <div class="lg:col-span-2 flex flex-col gap-4 lg:sticky lg:top-24">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 flex items-center justify-center">
                
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                
                <!-- Overlay de Erro para bloqueio por CORS -->
                <div id="errorOverlay" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-10">
                    <p class="text-red-400 font-semibold mb-2">Este canal bloqueia a reprodução direta via navegador (CORS).</p>
                    <p class="text-xs text-slate-400 mb-4 max-w-md">Para assistir a este sinal, utilize um aplicativo IPTV nativo ou abra o link diretamente.</p>
                    <a id="externalLinkBtn" href="#" target="_blank" rel="noopener noreferrer" 
                        class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors shadow-lg">
                        Abrir Sinal Direto
                    </a>
                </div>

            </div>

            <!-- Informações do Canal Atual -->
            <div id="currentChannelInfo" class="bg-slate-800/50 p-4 rounded-xl border border-slate-800">
                <h2 id="channelTitle" class="text-xl font-semibold text-white">Selecione um canal</h2>
                <p id="channelCategory" class="text-sm text-slate-400">Categoria: --</p>
            </div>
        </div>

        <!-- Seção Lateral: Filtros e Lista de Canais (Coluna da Direita - Fixa e com scroll próprio) -->
        <div class="flex flex-col gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-800 lg:sticky lg:top-24 lg:h-[calc(100vh-8rem)]">
            <div id="categoryButtons" class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin shrink-0"></div>
            <div id="channelsList" class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1"></div>
        </div>

    </main>

        let currentCategory = "Todos";
        let hlsInstance = null;

        const videoPlayer = document.getElementById("videoPlayer");
        const errorOverlay = document.getElementById("errorOverlay");
        const externalLinkBtn = document.getElementById("externalLinkBtn");
        const channelsListEl = document.getElementById("channelsList");
        const categoryButtonsEl = document.getElementById("categoryButtons");
        const searchInput = document.getElementById("searchInput");
        const channelTitle = document.getElementById("channelTitle");
        const channelCategory = document.getElementById("channelCategory");

        function renderCategories() {
            const categories = ["Todos", ...new Set(channels.map(c => c.category))];
            categoryButtonsEl.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.textContent = cat;
                btn.className = `px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${
                    currentCategory === cat ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderCategories();
                    renderChannels();
                };
                categoryButtonsEl.appendChild(btn);
            });
        }

        function renderChannels() {
            const searchTerm = searchInput.value.toLowerCase();
            channelsListEl.innerHTML = "";

            const filtered = channels.filter(channel => {
                const matchesCategory = currentCategory === "Todos" || channel.category === currentCategory;
                const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                channelsListEl.innerHTML = `<p class="text-slate-500 text-center py-4 text-sm">Nenhum canal encontrado</p>`;
                return;
            }

            filtered.forEach((channel) => {
                const item = document.createElement("div");
                item.className = "flex items-center gap-3 p-3 rounded-lg bg-slate-800/40 hover:bg-slate-800 cursor-pointer border border-slate-800/60 transition-all group";
                
                const logoHtml = channel.logo 
                    ? `<img src="${channel.logo}" class="w-10 h-10 object-contain rounded bg-slate-900/80 p-1" onerror="this.src='https://via.placeholder.com/40?text=TV'">`
                    : `<div class="w-10 h-10 rounded bg-slate-800 flex items-center justify-center text-xs text-slate-400 font-bold">TV</div>`;

                item.innerHTML = `
                    ${logoHtml}
                    <div class="overflow-hidden">
                        <h4 class="text-sm font-medium text-slate-200 group-hover:text-cyan-400 truncate">${channel.name}</h4>
                        <span class="text-xs text-slate-400">${channel.category}</span>
                    </div>
                `;

                item.onclick = () => playChannel(channel);
                channelsListEl.appendChild(item);
            });
        }

        function showError(url) {
            errorOverlay.classList.remove("hidden");
            externalLinkBtn.href = url;
        }

        function hideError() {
            errorOverlay.classList.add("hidden");
        }

        function playChannel(channel) {
            hideError();
            channelTitle.textContent = channel.name;
            channelCategory.textContent = `Categoria: ${channel.category}`;

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls({
                    manifestLoadingMaxRetry: 2,
                    levelLoadingMaxRetry: 2
                });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(videoPlayer);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(e => console.log("Autoplay bloqueado pelo navegador:", e));
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error("Erro ao reproduzir no navegador:", data);
                        showError(channel.url);
                    }
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.url;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    videoPlayer.play().catch(e => console.log("Autoplay bloqueado:", e));
                });
                videoPlayer.onerror = () => showError(channel.url);
            }
        }

        searchInput.addEventListener("input", renderChannels);
        renderCategories();
        renderChannels();

        if (channels.length > 0) {
            playChannel(channels[0]);
        }
